name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Every leg reports, so one OS failing does not hide another's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    - name: Run Tests
      run: npm test

  # Lint, formatting and types do not vary by OS or Node version, so one leg
  # covers them. Separate steps so the log shows which gate failed.
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint

    - name: Check Formatting
      run: npm run format:check

    - name: Run Typecheck
      run: npm run typecheck

  # The one check branch protection requires: its name stays fixed while the
  # matrix legs (and so their check names) change.
  ci-ok:
    needs: [build-and-test, lint]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Require build-and-test and lint to pass
      env:
        BUILD_RESULT: ${{ needs.build-and-test.result }}
        LINT_RESULT: ${{ needs.lint.result }}
      run: |
        echo "build-and-test finished as $BUILD_RESULT"
        echo "lint finished as $LINT_RESULT"
        test "$BUILD_RESULT" = "success"
        test "$LINT_RESULT" = "success"

  release:
    needs: ci-ok
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    # --ignore-scripts also skips prepublishOnly (npm run build); the explicit
    # "Run Build" step above already produced dist/, which is all `files` ships.
    - name: Publish to npm
      run: npm publish --provenance --ignore-scripts
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
