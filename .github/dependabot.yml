version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # One PR for all npm bumps instead of one per dependency.
    groups:
      npm-dependencies:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
